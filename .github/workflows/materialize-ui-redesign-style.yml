name: Materialize editorial UI stylesheet
on:
  push:
    branches: [ui-redesign-editorial]
    paths:
      - .github/workflows/materialize-ui-redesign-style.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-editorial
      - name: Materialize exact verified stylesheet
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .ui-redesign/styles.css.gz > web/styles.css
          test "$(git hash-object web/styles.css)" = "e72283db6e46984f746e6eaa680cf7d206dc3ae2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/styles.css
          if git diff --cached --quiet; then
            echo "Stylesheet already materialized."
            exit 0
          fi
          git commit -m "Materialize editorial UI redesign stylesheet"
          git push origin HEAD:ui-redesign-editorial
