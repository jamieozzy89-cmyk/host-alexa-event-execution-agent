name: Apply Stage 06 browser acceptance fixes
on:
  push:
    branches: [stage06-ui]
    paths:
      - '.stage06-ui-fix-trigger'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage06-ui
      - name: Apply exact verified fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          render = Path('web/render.ts')
          source = render.read_text()
          old = '''  view.append(head);
            if (prep) view.append(renderPrep(prep, reply, handlers, state, true));'''
          new = '''  view.append(head);
            if (reply?.speech) view.append(el("p", "live-status", reply.speech));
            if (prep) view.append(renderPrep(prep, reply, handlers, state, true));'''
          if source.count(old) != 1:
              raise SystemExit('renderLive source pattern did not match exactly once')
          render.write_text(source.replace(old, new))

          styles = Path('web/styles.css')
          css = styles.read_text()
          old_css = '''.mode-copy { margin: 14px 0 0; color: var(--text-soft); font-size: clamp(17px, 1.8vw, 24px); line-height: 1.5; }
            .live-view {'''
          new_css = '''.mode-copy { margin: 14px 0 0; color: var(--text-soft); font-size: clamp(17px, 1.8vw, 24px); line-height: 1.5; }
            .live-status { margin: -8px 0 24px; color: var(--text-soft); font-size: clamp(18px, 2vw, 26px); font-weight: 800; line-height: 1.35; }
            .live-view {'''
          if css.count(old_css) != 1:
              raise SystemExit('live status CSS source pattern did not match exactly once')
          styles.write_text(css.replace(old_css, new_css))

          test = Path('tests/web/host-ui.spec.ts')
          tests = test.read_text()
          old_test = '''async function openClean(page: Page): Promise<void> {
            await page.addInitScript(() => window.localStorage.clear());
            await page.goto("/");
            await expect(page.getByRole("button", { name: "Plan a dinner" })).toBeVisible();
          }'''
          new_test = '''async function openClean(page: Page): Promise<void> {
            await page.goto("/");
            await page.evaluate(() => window.localStorage.clear());
            await page.reload();
            await expect(page.getByRole("button", { name: "Plan a dinner" })).toBeVisible();
          }'''
          if tests.count(old_test) != 1:
              raise SystemExit('openClean test source pattern did not match exactly once')
          test.write_text(tests.replace(old_test, new_test))
          PY
      - name: Install browser environment
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify full Stage 06 candidate
        run: |
          npm test
          npm run build:web
          npm run test:web
      - name: Check UI boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'HostDomainEngine|validateHostState' web
          ! grep -RInE 'TODO|FIXME|HACK' web tests/web
      - name: Commit verified browser fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/render.ts web/styles.css tests/web/host-ui.spec.ts package-lock.json
          git commit -m "Fix Stage 06 live guidance and reload verification"
          git push origin HEAD:stage06-ui
