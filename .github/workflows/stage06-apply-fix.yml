name: Apply Stage 06 browser acceptance fixes
on:
  push:
    branches: [stage06-ui]
    paths:
      - '.stage06-ui-fix-trigger'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage06-ui
      - name: Apply exact verified fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          render = Path('web/render.ts')
          lines = render.read_text().splitlines()
          target = '  if (prep) view.append(renderPrep(prep, reply, handlers, state, true));'
          if lines.count(target) != 1:
              raise SystemExit(f'renderLive target count was {lines.count(target)}')
          index = lines.index(target)
          lines.insert(index, '  if (reply?.speech) view.append(el("p", "live-status", reply.speech));')
          render.write_text('\n'.join(lines) + '\n')

          styles = Path('web/styles.css')
          lines = styles.read_text().splitlines()
          target = '.mode-copy { margin: 14px 0 0; color: var(--text-soft); font-size: clamp(17px, 1.8vw, 24px); line-height: 1.5; }'
          if lines.count(target) != 1:
              raise SystemExit(f'mode-copy target count was {lines.count(target)}')
          index = lines.index(target) + 1
          lines.insert(index, '.live-status { margin: -8px 0 24px; color: var(--text-soft); font-size: clamp(18px, 2vw, 26px); font-weight: 800; line-height: 1.35; }')
          styles.write_text('\n'.join(lines) + '\n')

          test = Path('tests/web/host-ui.spec.ts')
          lines = test.read_text().splitlines()
          first = '  await page.addInitScript(() => window.localStorage.clear());'
          second = '  await page.goto("/");'
          if lines.count(first) != 1:
              raise SystemExit(f'openClean storage target count was {lines.count(first)}')
          index = lines.index(first)
          if index + 1 >= len(lines) or lines[index + 1] != second:
              raise SystemExit('openClean navigation line did not follow storage init line')
          lines[index:index + 2] = [
              '  await page.goto("/");',
              '  await page.evaluate(() => window.localStorage.clear());',
              '  await page.reload();',
          ]
          test.write_text('\n'.join(lines) + '\n')
          PY
      - name: Install browser environment
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify full Stage 06 candidate
        run: |
          npm test
          npm run build:web
          npm run test:web
      - name: Check UI boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'HostDomainEngine|validateHostState' web
          ! grep -RInE 'TODO|FIXME|HACK' web tests/web
      - name: Verify corrected blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object web/render.ts)" = "344d2b2b93c42458858e813dea26640e80c7bcc3"
          test "$(git hash-object web/styles.css)" = "b8f7015a4fa1ee896c64bb9b8cbc39ddb8c48b57"
          test "$(git hash-object tests/web/host-ui.spec.ts)" = "03a3ba64f2064ec8580887db6146e73169d6c76f"
      - name: Commit verified browser fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/render.ts web/styles.css tests/web/host-ui.spec.ts package-lock.json
          git commit -m "Fix Stage 06 live guidance and reload verification"
          git push origin HEAD:stage06-ui
