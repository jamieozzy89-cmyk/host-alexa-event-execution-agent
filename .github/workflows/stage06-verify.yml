name: Stage 06 UI verification
on:
  push:
    branches: [stage06-ui]
    paths:
      - '.stage06-verify-trigger'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage06-ui
      - name: Resolve pinned dependencies and lockfile
        run: npm install --ignore-scripts
      - name: Install Chromium with required system libraries
        run: npx playwright install --with-deps chromium
      - name: Verify Stage 02-05 regression suite
        run: npm test
      - name: Typecheck and build Stage 06 web application
        run: npm run build:web
      - name: Run touch-first browser acceptance suite
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm run test:web 2>&1 | tee reports/STAGE06_BROWSER_LAST_RUN.txt
      - name: Preserve browser diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- reports/STAGE06_BROWSER_LAST_RUN.txt)" ]; then
            git add reports/STAGE06_BROWSER_LAST_RUN.txt
            git commit -m "Record Stage 06 browser verification diagnostic"
            git push origin HEAD:stage06-ui
          fi
      - name: Enforce browser acceptance gate
        if: steps.browser.outcome == 'failure'
        run: exit 1
      - name: Check Stage 06 browser boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'HostDomainEngine|validateHostState' web
          ! grep -RInE 'TODO|FIXME|HACK' web tests/web
      - name: Preserve generated lockfile after successful verification
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock verified Stage 06 browser dependencies"
            git push origin HEAD:stage06-ui
          fi
