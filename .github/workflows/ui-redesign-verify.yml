name: Verify editorial Host UI redesign
on:
  push:
    branches: [ui-redesign-editorial]
    paths:
      - '.ui-redesign/trigger'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-editorial
          fetch-depth: 0
      - name: Restore locked redesign source and apply authorised corrections
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object web/main.ts)" = "6415e826d0d6fa9f67f9c47a6d5cb414c5e26fe7"
          test "$(git hash-object web/styles.css)" = "e72283db6e46984f746e6eaa680cf7d206dc3ae2"

          git show 128e282e059c0d7df9c7cbd28daf72ff4ee434ba:web/render.ts > web/render.ts
          test "$(git hash-object web/render.ts)" = "abb9a7aee41551407b88bc25ad49f7f8b64d2d8b"

          python - <<'PY'
          from pathlib import Path

          render = Path('web/render.ts')
          text = render.read_text()
          old = '  wrap.classList.add("event-card");\n'
          new = '  wrap.classList.add("event-card");\n  wrap.setAttribute("aria-label", "Authoritative event summary");\n'
          if text.count(old) != 1:
              raise SystemExit('event-card insertion point was not unique')
          render.write_text(text.replace(old, new, 1))

          css = Path('web/styles.css')
          text = css.read_text()
          replacements = {
              '  --ink-muted: #7b7d74;': '  --ink-muted: #696c63;',
              '  --tomato: #b94e3b;': '  --tomato: #a84433;',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'CSS replacement was not unique: {old}')
              text = text.replace(old, new, 1)
          css.write_text(text)

          spec = Path('tests/web/host-ui.spec.ts')
          text = spec.read_text()
          old = 'page.locator(".surface-card").filter({ hasText: "Current plan" })'
          if text.count(old) != 2:
              raise SystemExit('expected exactly two obsolete event-summary selectors')
          text = text.replace(old, 'page.getByRole("article", { name: "Authoritative event summary" })')
          spec.write_text(text)
          PY

          grep -F 'Tonight at a glance' web/render.ts
          grep -F 'aria-label", "Authoritative event summary' web/render.ts
          ! grep -F 'HTMKElement' web/render.ts
          ! grep -F 'Current plan' tests/web/host-ui.spec.ts
          grep -F 'Authoritative event summary' tests/web/host-ui.spec.ts
          grep -F -- '--ink-muted: #696c63;' web/styles.css
          grep -F -- '--tomato: #a84433;' web/styles.css
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify backend and production build
        run: |
          npm test
          npm run build:web
      - name: Run full browser acceptance scope
        run: npx playwright test tests/web/host-ui.spec.ts tests/web/hardening-ui.spec.ts tests/web/voice-ui.spec.ts --project=echo-show --project=mobile
      - name: Start verified preview
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/host-redesign-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/host-redesign-vite.log
          exit 1
      - name: Capture redesigned product states
        env:
          HOST_URL: http://127.0.0.1:4173
        run: |
          rm -rf submission/screenshots
          node submission/capture-stage10.mjs
          mkdir -p /tmp/host-redesign-screenshots
          cp submission/screenshots/*.png /tmp/host-redesign-screenshots/
      - name: Upload redesign screenshots
        uses: actions/upload-artifact@v4
        with:
          name: host-editorial-ui-redesign
          path: /tmp/host-redesign-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve verified redesign corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/render.ts web/styles.css tests/web/host-ui.spec.ts
          git commit -m "Verify editorial Host UI redesign corrections"
          git pull --rebase origin ui-redesign-editorial
          git push origin HEAD:ui-redesign-editorial
