name: Competition build verification

on:
  push:
    branches: [host-competition-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: host-competition-build
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Backend and application tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Production web build
        run: npm run build:web

      - name: Echo and mobile browser gate
        run: npx playwright test

      - name: Assemble controlled source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/host-competition-safe
          git archive --format=zip --output=/tmp/host-competition-safe/HOST_COMPETITION_BUILD_SOURCE.zip HEAD
          sha256sum /tmp/host-competition-safe/HOST_COMPETITION_BUILD_SOURCE.zip > /tmp/host-competition-safe/HOST_COMPETITION_BUILD_SOURCE.zip.sha256
          printf 'source_branch=host-competition-build\nsource_commit=%s\ncreated_utc=%s\n' "$(git rev-parse HEAD)" "$(date -u +%FT%TZ)" > /tmp/host-competition-safe/SOURCE_PROVENANCE.txt

      - name: Upload controlled source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: host-competition-build-source
          path: /tmp/host-competition-safe/
          if-no-files-found: error
          retention-days: 30
