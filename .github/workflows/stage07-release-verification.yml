name: Stage 07 clean release verification
on:
  push:
    branches: [stage07-release-verification]
    paths:
      - '.stage07-release-verify-trigger'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium with system libraries
        run: npx playwright install --with-deps chromium
      - name: Verify backend and production build
        run: |
          npm test
          npm run build:web
      - name: Verify complete touch and voice browser suite
        run: npm run test:web
      - name: Verify application boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'HostDomainEngine|validateHostState|\.\./src/domain|src/domain' web
          ! grep -RInE 'TODO|FIXME|HACK' web tests/web
